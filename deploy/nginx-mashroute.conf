# MashRoute — Nginx site config (VPS deployment)
# Put at: /etc/nginx/sites-available/mashroute  then symlink to sites-enabled.
# Replace mashroute.com with your real domain. Run certbot afterwards for HTTPS.

server {
    listen 80;
    server_name mashroute.com www.mashroute.com;

    # Allow large uploads (logos / verification docs up to 10MB)
    client_max_body_size 16M;

    # ── Frontend static build ──────────────────────────────────
    root /var/www/mashroute/frontend/dist;
    index index.html;

    # ── API → Node backend (PM2 on 127.0.0.1:3001) ────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Socket.io (websockets) ────────────────────────────────
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Locally-stored uploaded files (Drive fallback) ────────
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    # ── Health check (for uptime monitors) ────────────────────
    location = /health {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    # ── SPA fallback (React Router) ───────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
